# Reusable template: clone this public toolkit, build the task, and run Send Teams test notification.
# Copy this file into your pipeline repository (or submodule this repo) and reference it from your YAML.
# Requires secret variable TeamsWebhookUrl. Job must allow scripts to access the OAuth token.

parameters:
  - name: teamsWebhookUrl
    type: string
  - name: buildId
    type: string
    default: '$(Build.BuildId)'
  - name: organizationUri
    type: string
    default: '$(System.TeamFoundationCollectionUri)'
  - name: projectName
    type: string
    default: '$(System.TeamProject)'
  - name: language
    type: string
    default: en
  - name: cardTitle
    type: string
    default: ''
  - name: openAttachmentsPane
    type: boolean
    default: false
  - name: debugMode
    type: boolean
    default: false
  - name: notifyOnSuccess
    type: boolean
    default: false
  - name: nodeVersion
    type: string
    default: '20.x'
  - name: toolkitRepoUrl
    type: string
    default: 'https://github.com/winningconsulting/winning-azure-devops.git'
  - name: toolkitRef
    type: string
    default: main
  - name: toolkitDir
    type: string
    default: '$(Agent.BuildDirectory)/winning-azure-devops'

steps:
  - bash: |
      set -euo pipefail
      git clone --depth 1 --branch "${{ parameters.toolkitRef }}" \
        "${{ parameters.toolkitRepoUrl }}" \
        "${{ parameters.toolkitDir }}"
    displayName: Clone winning-azure-devops toolkit

  - task: NodeTool@0
    displayName: Use Node.js
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}

  - script: npm ci && npm run build
    displayName: Build Teams notification task
    workingDirectory: ${{ parameters.toolkitDir }}/SendTeamsTestNotification

  - task: Bash@3
    displayName: Send Teams test notification
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      TEAMS_WEBHOOK_URL: ${{ parameters.teamsWebhookUrl }}
      BUILD_ID: ${{ parameters.buildId }}
      ORGANIZATION_URI: ${{ parameters.organizationUri }}
      PROJECT_NAME: ${{ parameters.projectName }}
      LANGUAGE: ${{ parameters.language }}
      CARD_TITLE: ${{ parameters.cardTitle }}
      TEAMS_OPEN_ATTACHMENTS_PANE: ${{ lower(parameters.openAttachmentsPane) }}
      DEBUG_MODE: ${{ lower(parameters.debugMode) }}
      NOTIFY_ON_SUCCESS: ${{ lower(parameters.notifyOnSuccess) }}
    inputs:
      targetType: inline
      script: node "${{ parameters.toolkitDir }}/scripts/run-local.js"
